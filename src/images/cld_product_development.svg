  <rect x="45" y="187" width="150" height="46" rx="12" fill="#E3F2FD" stroke="#1565C0" stroke-width="2.5"/>
  <text x="120" y="215" text-anchor="middle" font-family="Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif" font-size="22" font-weight="bold" fill="#0D47A1">&#x58F2;&#x4E0A;</text>

  <!-- Reinforcing loop label -->
