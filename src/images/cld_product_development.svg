  <!-- Internal variables (dots + labels) -->
  <circle cx="185" cy="430" r="5" fill="#E65100"/>
  <text x="185" y="420" text-anchor="middle" font-family="Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif" font-size="11" fill="#5D4037">NW&#x52B9;&#x679C;</text>
  <circle cx="345" cy="425" r="5" fill="#E65100"/>
  <text x="345" y="415" text-anchor="middle" font-family="Hiragino Kaku Gothic ProN, Noto Sans JP, sans-serif" font-size="11" fill="#5D4037">&#x4FE1;&#x983C;&#x6027;</text>
  <circle cx="175" cy="490" r="5" fill="#E65100"/>
