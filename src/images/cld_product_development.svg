  <!-- Cloud to Learning -->
  <path d="M 435 440 Q 510 420, 590 418" fill="none" stroke="#C62828" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#ahf)"/>
  <!-- Learning to Capability -->
  <path d="M 650 402 Q 640 320, 690 240" fill="none" stroke="#C62828" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#ahf)"/>
  <!-- Capability to Cloud -->
