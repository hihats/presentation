  <line x1="600" y1="108" x2="593" y2="122" stroke="#546E7A" stroke-width="2.5"/>
  <line x1="607" y1="111" x2="600" y2="125" stroke="#546E7A" stroke-width="2.5"/>
  <text x="615" y="105" font-family="sans-serif" font-size="16" font-weight="bold" fill="#37474F">+</text>
